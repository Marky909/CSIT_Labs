<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJAX XML Demo</title>
    <script>
        function loadXML() {
            let xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function () {
                if (xhr.readyState == 4 && xhr.status == 200) {
                    let xmlDoc = xhr.responseXML;
                    let books = xmlDoc.getElementsByTagName("book");
                    let output = "<table border='1' cellpadding='8'><tr><th>ID</th><th>Title</th><th>Author</th><th>Price</th></tr>";

                    for (let i = 0; i < books.length; i++) {
                        output += "<tr>";
                        output += "<td>" + books[i].getAttribute("id") + "</td>";
                        output += "<td>" + books[i].getElementsByTagName("title")[0].childNodes[0].nodeValue + "</td>";
                        output += "<td>" + books[i].getElementsByTagName("author")[0].childNodes[0].nodeValue + "</td>";
                        output += "<td>" + books[i].getElementsByTagName("price")[0].childNodes[0].nodeValue + "</td>";
                        output += "</tr>";
                    }

                    output += "</table>";
                    document.getElementById("result").innerHTML = output;
                }
            };
            xhr.open("GET", "books.xml", true);
            xhr.send();
        }
    </script>
</head>
<body>

    <h1>AJAX and XML Processing</h1>
    <button onclick="loadXML()">Load XML Data</button>
    <div id="result"></div>

</body>
</html>
